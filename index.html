<!DOCTYPE html>
<html lang='en-GB'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Get Safest Way</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2a0a4a 0%, #5b1a8a 100%);
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
    }
    .logo { width: 180px; margin: 0 auto 24px; }
    .logo img { width: 100%; height: auto; display: block; }
    h1 { font-size: 22px; margin-bottom: 8px; color: #1d1d1f; }
    p { color: #6e6e73; margin-bottom: 28px; font-size: 15px; }
    .buttons { display: flex; flex-direction: column; gap: 4px; align-items: center; }
    .btn {
      display: inline-block;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.8; }
    /* Google Play PNG has ~25% built-in whitespace; compensate so logos appear equal */
    .btn-ios img  { display: block; height: 46px; width: auto; }
    .btn-android img { display: block; height: 70px; width: auto; }
    #status { color: #6e6e73; font-size: 14px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class='card'>
    <div class='logo'>
      <img src='https://assets.zyrosite.com/cdn-cgi/image/format=auto,w=375,fit=crop/m2WbXQo2NytV459k/logo_dark-4x-mjE5wlB4EBiqPppZ.png' alt='Safest Way'>
    </div>
    <h1>Get Safest Way</h1>
    <p>Tap below to download on your device.</p>
    <div class='buttons'>
      <a class='btn btn-ios' href='https://apps.apple.com/gb/app/safest-way/id6502523910'>
        <img src='https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg' alt='Download on the App Store'>
      </a>
      <a class='btn btn-android' href='https://play.google.com/store/apps/details?id=com.safestway'>
        <img src='https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png' alt='Get it on Google Play'>
      </a>
    </div>
    <p id='status'></p>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js';
    import { getFirestore, addDoc, collection } from 'https://www.gstatic.com/firebasejs/11.3.1/firebase-firestore.js';

    const app = initializeApp({
      apiKey:            "AIzaSyA2VoCXZIADecKUNpE1wyuKWWDc4ROQiKE",
      authDomain:        "safestway-8210f.firebaseapp.com",
      projectId:         "safestway-8210f",
      storageBucket:     "safestway-8210f.firebasestorage.app",
      messagingSenderId: "886273374564",
      appId:             "1:886273374564:web:22aea05f4b30062c066271",
      measurementId:     "G-4PYVKSJBVE",
    });
    const db = getFirestore(app);

    const APPLE_URL   = 'https://apps.apple.com/gb/app/safest-way/id6502523910';
    const ANDROID_URL = 'https://play.google.com/store/apps/details?id=com.safestway';

    const ua        = navigator.userAgent || navigator.vendor || '';
    const isAndroid = /android/i.test(ua);
    const isIOS     = /iPad|iPhone|iPod/.test(ua) ||
                      (ua.includes('Mac') && 'ontouchend' in document);

    function logAndRedirect(platform, url) {
      document.getElementById('status').textContent =
        platform === 'ios' ? 'Redirecting to the App Store...' : 'Redirecting to Google Play...';
      addDoc(collection(db, 'redirects'), {
        platform,
        ts: new Date().toISOString(),
      }).catch(() => {});
      window.location.href = url;
    }

    if (isAndroid)    logAndRedirect('android', ANDROID_URL);
    else if (isIOS)   logAndRedirect('ios', APPLE_URL);
    // Desktop: do nothing, show both buttons
  </script>
</body>
</html>
