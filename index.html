<!DOCTYPE html>
<html lang='en-GB'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Get Safest Way</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f7;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h1 { font-size: 24px; margin-bottom: 12px; color: #1d1d1f; }
    p { color: #6e6e73; margin-bottom: 24px; font-size: 16px; }
    .buttons { display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: block;
      padding: 14px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-ios { background: #000; color: white; }
    .btn-android { background: #01875f; color: white; }
    #status { color: #6e6e73; font-size: 14px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class='card'>
    <h1>Get Safest Way</h1>
    <p>Tap below to download on your device.</p>
    <div class='buttons'>
      <a class='btn btn-ios' href='https://apps.apple.com/gb/app/safest-way/id6502523910'>Download on the App Store</a>
      <a class='btn btn-android' href='https://play.google.com/store/apps/details?id=com.safestway'>Get it on Google Play</a>
    </div>
    <p id='status'></p>
  </div>

  <script>
    const APPLE_URL = 'https://apps.apple.com/gb/app/safest-way/id6502523910';
    const ANDROID_URL = 'https://play.google.com/store/apps/details?id=com.safestway';

    const ua = navigator.userAgent || navigator.vendor || '';
    const isAndroid = /android/i.test(ua);
    // iPadOS 13+ reports as Mac, so check for touch as a tiebreaker
    const isIOS = /iPad|iPhone|iPod/.test(ua) ||
                  (ua.includes('Mac') && 'ontouchend' in document);

    if (isAndroid) {
      document.getElementById('status').textContent = 'Redirecting to Google Play...';
      window.location.href = ANDROID_URL;
    } else if (isIOS) {
      document.getElementById('status').textContent = 'Redirecting to the App Store...';
      window.location.href = APPLE_URL;
    }
    // Desktop: do nothing, show both buttons
  </script>
</body>
</html>
